name: Contribution snake

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0a0a0a&color_dots=#ebedf0,#cfcfcf,#9e9e9e,#5f5f5f,#262626
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2f2f1&color_dots=#161b22,#2b2b2b,#555555,#8f8f8f,#d6d6d6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
